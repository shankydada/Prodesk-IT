<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Cash Flow Dashboard</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- jsPDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-slate-100 min-h-screen">

    <!-- Toast -->
    <div id="toast"
         class="toast hidden">
    </div>

    <!-- Warning Banner -->
    <div id="warning-banner"
         class="hidden bg-red-600 text-white text-center py-3 font-semibold">
        Remaining Balance is below 10% of your Salary.
    </div>

    <div class="max-w-7xl mx-auto p-8">

        <!-- Heading -->

        <div class="mb-8">

            <h1 class="text-4xl font-bold text-slate-800">
                Cash Flow Dashboard
            </h1>

            <p class="text-gray-500 mt-2">
                Salary & Expense Tracker
            </p>

        </div>

        <!-- Cards -->

        <div class="grid md:grid-cols-3 gap-6 mb-8">

            <div class="bg-white rounded-xl shadow p-6">

                <h2 class="text-gray-500">
                    Total Salary
                </h2>

                <p id="display-salary"
                   class="text-3xl font-bold text-green-600 mt-3">
                    $0.00
                </p>

            </div>

            <div class="bg-white rounded-xl shadow p-6">

                <h2 class="text-gray-500">
                    Total Expenses
                </h2>

                <p id="display-expenses"
                   class="text-3xl font-bold text-red-500 mt-3">
                    $0.00
                </p>

            </div>

            <div class="bg-white rounded-xl shadow p-6">

                <h2 class="text-gray-500">
                    Remaining Balance
                </h2>

                <p id="display-balance"
                   class="text-3xl font-bold text-blue-600 mt-3">
                    $0.00
                </p>

            </div>

        </div>

        <div class="grid lg:grid-cols-2 gap-8">

            <!-- LEFT -->

            <div class="space-y-6">

                <!-- Form -->

                <div class="bg-white rounded-xl shadow p-6">

                    <h2 class="text-xl font-semibold mb-5">
                        Add Salary / Expense
                    </h2>

                    <form id="expense-form"
                          class="space-y-4">

                        <input
                            id="salary-input"
                            type="number"
                            placeholder="Enter Salary"
                            class="w-full border rounded-lg p-3">

                        <input
                            id="expense-name"
                            type="text"
                            placeholder="Expense Name"
                            class="w-full border rounded-lg p-3">

                        <input
                            id="expense-amount"
                            type="number"
                            placeholder="Expense Amount"
                            class="w-full border rounded-lg p-3">

                        <button
                            class="w-full bg-blue-600 hover:bg-blue-700 transition text-white rounded-lg p-3">

                            <i class="fa-solid fa-plus"></i>

                            Add Entry

                        </button>

                    </form>

                </div>

                <!-- Expense List -->

                <div class="bg-white rounded-xl shadow p-6">

                    <div class="flex justify-between items-center mb-5">

                        <h2 class="text-xl font-semibold">

                            Expense History

                        </h2>

                        <span id="expense-count"
                              class="text-sm text-gray-500">
                            0 Items
                        </span>

                    </div>

                    <ul id="expense-list"
                        class="space-y-3">

                    </ul>

                    <div id="empty-state"
                         class="text-center text-gray-400 py-8">

                        <i class="fa-solid fa-wallet text-5xl mb-4"></i>

                        <p>No Expenses Added Yet</p>

                    </div>

                </div>

            </div>

            <!-- RIGHT -->

            <div class="space-y-6">

                <!-- Chart -->

                <div class="bg-white rounded-xl shadow p-6">

                    <h2 class="text-xl font-semibold mb-5">

                        Expense Overview

                    </h2>

                    <canvas id="expenseChart"></canvas>

                </div>

                <!-- Controls -->

                <div class="bg-white rounded-xl shadow p-6">

                    <div class="grid md:grid-cols-2 gap-4">

                        <select
                            id="currency-selector"
                            class="border rounded-lg p-3">

                            <option value="USD">
                                USD ($)
                            </option>

                            <option value="INR">
                                INR (₹)
                            </option>

                        </select>

                        <button
                            id="download-btn"
                            class="bg-green-600 hover:bg-green-700 transition text-white rounded-lg p-3">

                            <i class="fa-solid fa-file-pdf"></i>

                            Download PDF

                        </button>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <script src="app.js"></script>

</body>

</html>
